# Release automation driven by `.changeset/*.md` files (Knope).
#
# A change file looks like:
#   ---
#   aimux: minor        # minor | patch | major
#   ---
#   One-line summary for the changelog.
#
# Commit messages are intentionally ignored as a version source.
[packages.aimux]
versioned_files = ["Cargo.toml", "Cargo.lock"]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"
allow_empty = true

[[workflows.steps]]
type = "Command"
command = 'git commit -m "chore: prepare release $version"'

[[workflows.steps]]
type = "Command"
command = "git push --force origin release"
