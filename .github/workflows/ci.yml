name: CI

on:
  push:
  pull_request:
    # PRs target `develop`; `main` is release-only (bot Release PRs skip CI —
    # their content is just the version bump + CHANGELOG, already gated by
    # pending change files).
    branches:
      - develop

env:
  CARGO_TERM_COLOR: always

jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test
