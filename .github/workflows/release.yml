name: Release

# Binary build + GitHub Release assets. Called from release-plz in the same
# run (GITHUB_TOKEN cannot start a second workflow). Also runs on a human
# `git push` of a v* tag, and on workflow_dispatch.
on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to ship (e.g. v0.1.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to ship (e.g. v0.1.1)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            target: aarch64-apple-darwin
            binary: aimux
          - os: macos-14
            platform: darwin-x64
            target: x86_64-apple-darwin
            binary: aimux
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            binary: aimux.exe
          - os: ubuntu-latest
            platform: linux-x64-musl
            target: x86_64-unknown-linux-musl
            binary: aimux
            musl_native: true
          - os: ubuntu-latest
            platform: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            binary: aimux
            use_cross: true

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.musl_native
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --locked

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }} --locked
        env:
          # Shrink panic/path strings baked into the binary.
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=aimux

      - name: Strip
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if command -v strip >/dev/null 2>&1 && [[ "${{ matrix.binary }}" != *.exe ]]; then
            strip "$bin" || true
          fi
          ls -lh "$bin"

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"

      - uses: actions/upload-artifact@v6
        with:
          name: aimux-${{ matrix.platform }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error

  universal-macos:
    name: Universal macOS
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: aimux-darwin-arm64
          path: arm64
      - uses: actions/download-artifact@v7
        with:
          name: aimux-darwin-x64
          path: x64
      - name: lipo
        run: |
          mkdir -p universal
          lipo -create -output universal/aimux arm64/aimux x64/aimux
          chmod +x universal/aimux
          file universal/aimux
          ls -lh universal/aimux
      - uses: actions/upload-artifact@v6
        with:
          name: aimux-darwin-universal
          path: universal/aimux
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, universal-macos]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: aimux-*
      - name: Pack gzip/zip assets
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
          mkdir -p release-assets
          VERSION="${RELEASE_TAG}"

          pack_tar() {
            local name="$1"
            local src="$2"
            if [ -f "$src" ]; then
              tar -cf - -C "$(dirname "$src")" "$(basename "$src")" | gzip -9 > "release-assets/${name}.tar.gz"
              cp "release-assets/${name}.tar.gz" "release-assets/aimux-${VERSION}-${name#aimux-}.tar.gz"
            fi
          }

          pack_tar aimux-darwin-universal artifacts/aimux-darwin-universal/aimux
          pack_tar aimux-darwin-arm64 artifacts/aimux-darwin-arm64/aimux
          pack_tar aimux-darwin-x64 artifacts/aimux-darwin-x64/aimux
          pack_tar aimux-linux-x64-musl artifacts/aimux-linux-x64-musl/aimux
          pack_tar aimux-linux-arm64-musl artifacts/aimux-linux-arm64-musl/aimux

          if [ -f artifacts/aimux-windows-x64/aimux.exe ]; then
            (cd artifacts/aimux-windows-x64 && zip -9 "../../release-assets/aimux-windows-x64.zip" aimux.exe)
            cp release-assets/aimux-windows-x64.zip "release-assets/aimux-${VERSION}-windows-x64.zip"
          fi

          cp install.sh install.ps1 release-assets/
          chmod 755 release-assets/install.sh

          (
            cd release-assets
            sha256sum * > checksums.txt
          )
          ls -lh release-assets/

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: aimux ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Linux / macOS:

            ```bash
            curl -fsSL https://github.com/iam2r/aimux/releases/latest/download/install.sh | bash
            ```

            Windows (PowerShell):

            ```powershell
            irm https://github.com/iam2r/aimux/releases/latest/download/install.ps1 | iex
            ```

            Linux assets are static musl builds. Archives are gzip/zip compressed.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
